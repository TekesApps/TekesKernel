name: Feature or contract change
description: Propose new behavior or a change to a contract in spec/
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behavior does not allow it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you propose, and which contract in spec/ it affects, if any.
