name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Architecture atlas dependencies
        run: python3 -m pip install -r scripts/architecture-requirements.txt
      - name: scripts/ci.sh
        run: scripts/ci.sh

  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox dependencies and bubblewrap AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor-profiles
          # Ubuntu 24.04 restricts namespace capabilities unless bwrap has
          # its distribution profile. Load only that profile; keep global
          # AppArmor and unprivileged-userns restrictions unchanged.
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          dpkg-query -W bubblewrap apparmor apparmor-profiles
          sysctl -e kernel.unprivileged_userns_clone \
            kernel.apparmor_restrict_unprivileged_userns \
            kernel.apparmor_restrict_unprivileged_unconfined \
            user.max_user_namespaces
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Linux sandbox runtime (bubblewrap, Landlock and automatic selection)
        run: scripts/ci-linux-sandbox.sh --backend all
      - name: Build and test
        run: cargo test --workspace --locked --no-fail-fast
