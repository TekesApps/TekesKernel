name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The steps to reproduce, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` or the release you run.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.5, Apple M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or ledger excerpt
      description: Remove keys, tokens and personal paths before pasting.
      render: text
